[project]
name = "stream-caption"
version = "0.1.0"
description = "Real-time Japanese speech recognition and translation overlay for live streams"
requires-python = ">=3.11"
dependencies = [
    "soundcard",
    "faster-whisper",
    "anthropic",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
