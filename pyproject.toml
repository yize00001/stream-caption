[project]
name = "stream-caption"
version = "0.1.0"
description = "Real-time Japanese speech recognition and translation overlay for live streams"
requires-python = ">=3.11"
dependencies = [
    "soundcard",
    "faster-whisper",
    "anthropic",
    "openai",
    "opencc-python-reimplemented",
    "python-dotenv",
    "deep-translator",
]

[project.scripts]
stream-caption = "stream_caption.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_caption"]
